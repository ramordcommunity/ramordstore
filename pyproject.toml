[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ramord-store"
version = "1.0.0"
authors = [
    { name = "Ramord Community", email = "ramordhelp@gmail.com" },
]
description = "Application hub and support center for Linux"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "PySide6>=6.5.0",
]

[project.scripts]
ramord-store = "main:main"
